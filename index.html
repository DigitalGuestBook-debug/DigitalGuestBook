!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Guest Book</title>
<meta name="theme-color" content="#0b0907">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&family=Jost:wght@400;500&display=swap">
<style>
:root{
  --emas:#c9a961;--emas-t:#a8863f;--gading:#faf6ee;--tinta:#2a2520;--garis:#e8dec8;--aksen:#d4b46a;
  --foil:linear-gradient(180deg,#fdf1cb 0%,#e6c87f 46%,#b48a3e 100%);
  --serif:'Cormorant Garamond',Georgia,serif;
  --caps:'Cinzel','Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Jost',Arial,sans-serif;background:var(--gading);color:var(--tinta)}
[hidden]{display:none!important}
h1{font-family:var(--serif)}
 
/* ---------- kepala ---------- */
.head{position:relative;background:radial-gradient(ellipse at 50% 0%,#3a2e1e 0%,#15110d 70%);color:#f3e6c4;text-align:center;padding:30px 16px 24px;border-bottom:3px double var(--emas)}
.head.ringkas{padding:20px 16px 18px}
.head h1{margin:10px 0 4px;font-size:clamp(34px,6vw,46px);font-weight:600;letter-spacing:.05em;
  background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.head.ringkas h1{font-size:clamp(30px,5vw,38px)}
.eyebrow{font-family:var(--caps);font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--emas)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--emas);font-size:12px;margin:8px 0}
.orn::before,.orn::after{content:"";width:72px;height:1px;background:linear-gradient(90deg,transparent,var(--emas))}
.orn::after{transform:scaleX(-1)}
.acara{font-family:var(--caps);font-size:12px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:#d6c394}
.cnt{display:inline-block;margin-top:16px;padding:8px 26px;border:1px solid rgba(201,169,97,.6);border-radius:999px;
  font:600 20px/1.1 var(--serif);letter-spacing:.05em;color:#f6ebcf;background:rgba(201,169,97,.06);
  box-shadow:inset 0 0 0 3px rgba(11,9,7,.9),inset 0 0 0 4px rgba(201,169,97,.25)}
 
/* ---------- daftar ---------- */
.tools{padding:18px 14px 6px;max-width:760px;margin:0 auto}
#q{width:100%;padding:16px 20px;margin-bottom:10px;font:400 18px 'Jost',sans-serif;color:var(--tinta);background:#fff;border:1px solid var(--emas);border-radius:12px;outline:none;box-shadow:0 2px 10px rgba(168,134,63,.12)}
#q:focus{box-shadow:0 0 0 3px rgba(201,169,97,.3)}
.sec{width:100%;padding:14px;font:500 12px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--emas-t);background:#fff;border:1px solid var(--emas);border-radius:12px}
#kosong{text-align:center;padding:28px;color:#9a8f7a;font:italic 500 24px var(--serif)}
#list{padding-bottom:160px;max-width:760px;margin:0 auto}
.item{display:flex;align-items:center;gap:16px;background:#fff;margin:9px 14px;padding:15px 18px;border:1px solid var(--garis);border-radius:14px;box-shadow:0 2px 8px rgba(60,45,20,.05);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.item.pilih{border-color:var(--emas);box-shadow:0 0 0 2px rgba(201,169,97,.28)}
.item.done{background:#f4f1e6;border-style:dashed}
.item.done .n1{color:#8c8570}
.item input{-webkit-appearance:none;appearance:none;flex:none;width:30px;height:30px;margin:0;border:1.5px solid var(--emas);border-radius:50%;background:#fff;display:grid;place-items:center}
.item input::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
.item input:checked{background:linear-gradient(135deg,#e0c47e,#a88238);border-color:#a88238}
.item input:checked::after{transform:rotate(45deg) scale(1)}
.nm{flex:1;min-width:0}
.n1{font:600 24px/1.15 var(--serif)}
.kat{margin-top:4px;font:400 11px var(--caps);letter-spacing:.16em;text-transform:uppercase;color:#a09580}
.jam{font-size:12px;letter-spacing:.08em;color:#6b8a73;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;padding:30px 14px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--gading) 62%,rgba(250,246,238,0))}
.bar>*{max-width:760px;margin-left:auto;margin-right:auto}
.pesan{min-height:18px;text-align:center;color:#a14a3b;font-size:14px;padding-bottom:6px}
.btn{width:100%;padding:18px;font:600 13px var(--caps);letter-spacing:.24em;text-transform:uppercase;color:#1b1610;
  background:linear-gradient(180deg,#f0d998 0%,#d4b061 48%,#a98337 100%);border:0;border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 22px rgba(168,134,63,.32)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6}
.btn.sek{background:transparent;color:var(--emas);border:1px solid var(--emas);box-shadow:none}
 
/* ---------- scanner ---------- */
#vScan{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#1d1710 0%,#0b0907 75%);color:#f3e6c4;display:flex;flex-direction:column}
.kamera{position:relative;flex:1;min-height:320px;width:calc(100% - 40px);max-width:820px;margin:22px auto 16px;border-radius:20px;overflow:hidden;background:#000;
  border:1px solid rgba(201,169,97,.6);
  box-shadow:0 0 0 6px #0b0907,0 0 0 7px rgba(201,169,97,.35),0 24px 60px rgba(0,0,0,.65)}
.kamera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kamera video.cermin{transform:scaleX(-1)}
.bingkai{position:absolute;inset:14%;pointer-events:none}
.bingkai i{position:absolute;width:40px;height:40px;border:3px solid var(--emas);transition:border-color .15s,filter .15s}
.bingkai i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.bingkai i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.bingkai i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.bingkai i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.kamera.kunci .bingkai i{border-color:#fff6d6;filter:drop-shadow(0 0 10px #f0d998)}
.sapu{position:absolute;left:14%;right:14%;height:2px;background:linear-gradient(90deg,transparent,var(--emas),transparent);box-shadow:0 0 14px rgba(201,169,97,.7);animation:sapu 2.4s ease-in-out infinite}
.infoscan{text-align:center;padding:0 16px 10px;font:400 12px var(--caps);letter-spacing:.22em;text-transform:uppercase;color:#d6c394}
.infoscan.err{color:#e59a8f}
.aksiscan{display:flex;gap:12px;padding:6px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:860px;margin:0 auto}
.aksiscan .btn{flex:1;padding:16px}
 
/* ---------- layar hasil ---------- */
.layar{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,#3a2e1e 0%,#0d0b08 78%);color:#f6ebcf;animation:masuk .3s ease both;overflow:auto}
.layar::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;
  background-image:radial-gradient(circle,rgba(246,226,160,.95) 0 1.4px,transparent 2.4px),radial-gradient(circle,rgba(246,226,160,.7) 0 1px,transparent 2px);
  background-size:150px 190px,95px 125px;background-position:0 0,45px 65px;animation:kilau 3.2s ease-in-out infinite alternate}
.layar::after{content:"";position:fixed;inset:16px;pointer-events:none;border:1px solid rgba(212,180,106,.45);outline:1px solid rgba(212,180,106,.2);outline-offset:6px}
.layar .box{position:relative;z-index:1;padding:36px 30px;max-width:620px;animation:naik .7s .05s ease both}
.cincin{width:120px;height:120px;margin:0 auto 16px;overflow:visible}
.cincin .ring{fill:none;stroke:var(--aksen);stroke-width:1.6;stroke-dasharray:315;stroke-dashoffset:315;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);animation:gambar .9s ease forwards}
.cincin path{fill:none;stroke:var(--aksen);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:gambar .6s .55s ease forwards}
.cincin .titik{fill:var(--aksen)}
.layar .eyebrow{color:var(--aksen)}
.layar h1{font:400 clamp(52px,10vw,76px)/1.05 'Pinyon Script','Cormorant Garamond',cursive;margin:14px 0 6px;color:var(--aksen);letter-spacing:.01em}
.layar .orn{color:var(--aksen)}
.layar .orn::before,.layar .orn::after{background:linear-gradient(90deg,transparent,var(--aksen))}
.layar .nama{font:italic 600 clamp(36px,7vw,52px)/1.18 var(--serif);color:var(--aksen);margin:10px 0}
.layar .nama.kecil{font-size:28px;margin:5px 0}
.layar.success h1,.layar.success .nama{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:0 .1em .08em}
.layar .cat{font:500 22px/1.5 var(--serif);color:#e0d4b8;margin:12px 0 0}
.layar .syukur{margin-top:24px;font:400 12px var(--caps);letter-spacing:.34em;text-transform:uppercase;color:#bfae7c;line-height:1.9}
.layar .lagi{margin-top:30px;padding:15px 34px;border:1px solid var(--aksen);color:var(--aksen);background:transparent;border-radius:999px;font:500 12px var(--caps);letter-spacing:.2em;text-transform:uppercase}
 
@keyframes gambar{to{stroke-dashoffset:0}}
@keyframes naik{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes masuk{from{opacity:0}to{opacity:1}}
@keyframes sapu{0%,100%{top:14%}50%{top:84%}}
@keyframes kilau{from{opacity:.12}to{opacity:.42}}
@media (prefers-reduced-motion:reduce){.sapu,.layar::before{animation:none}}
</style>
</head>
<body>
 
<div id="vScan" hidden>
  <div class="head ringkas">
    <div class="eyebrow">Digital Guest Book</div>
    <h1>Scan Kehadiran</h1>
    <div class="acara">WEDDING OF JASMINE &amp; HAIKAL</div>
    <div class="cnt" id="statScan">Memuat...</div>
  </div>
  <div class="kamera" id="kamera">
    <video id="vid" playsinline muted autoplay></video>
    <div class="bingkai"><i></i><i></i><i></i><i></i></div>
    <div class="sapu"></div>
  </div>
  <div id="infoScan" class="infoscan">Menyiapkan kamera...</div>
  <div class="aksiscan">
    <button class="btn sek" type="button" onclick="gantiKamera()">Ganti Kamera</button>
    <button class="btn" type="button" onclick="bukaCari()">Cari Nama</button>
  </div>
</div>
 
<div id="vList" hidden>
  <div class="head">
    <div class="eyebrow">Digital Guest Book</div>
    <h1 id="jdl"></h1>
    <div class="orn">✦</div>
    <div class="acara">WEDDING OF JASMINE &amp; HAIKAL</div>
    <div class="cnt" id="cnt"></div>
  </div>
  <div class="tools">
    <button id="btnKembali" class="sec" type="button" onclick="tutupList()" hidden style="margin-bottom:10px">‹ Kembali ke Scan</button>
    <input id="q" type="search" placeholder="Ketik nama tamu..." oninput="cari()" autocomplete="off">
    <button id="btnSemua" class="sec" type="button" onclick="pilihSemua()">Pilih semua yang belum hadir</button>
  </div>
  <div id="list"></div>
  <div id="kosong" hidden>Nama tidak ditemukan</div>
  <div class="bar">
    <div id="pesan" class="pesan"></div>
    <button id="btn" class="btn" type="button" onclick="simpan()">Simpan Kehadiran (0)</button>
  </div>
</div>
 
<div id="vHasil" class="layar" hidden></div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* =====================  PENGATURAN  ===================== */
// URL Web App Apps Script (yang berakhiran /exec)
var API_URL = 'https://script.google.com/macros/s/AKfycbwpL_BpV22GKb5vq2ZCmmtPlvCQMpVeFriS-Qb3v1YmXhEeNbgtn9UxF8Y9Nd19_z30/exec';
var ACARA = 'WEDDING OF JASMINE & HAIKAL';
/* ======================================================== */
 
var MODE = 'scan';
var DATA = null;
var STAT = { hadir: 0, total: 0 };
var IKON = {
  success: '<svg class="cincin" viewBox="0 0 110 110"><circle class="ring" cx="55" cy="55" r="50"/><path d="M36 57 L50 71 L78 41"/></svg>',
  info: '<svg class="cincin" viewBox="0 0 110 110"><circle class="ring" cx="55" cy="55" r="50"/><path d="M55 50 L55 78"/><circle class="titik" cx="55" cy="37" r="3"/></svg>',
  warning: '<svg class="cincin" viewBox="0 0 110 110"><circle class="ring" cx="55" cy="55" r="50"/><path d="M55 33 L55 62"/><path d="M55 77 L55 77.1"/></svg>',
  error: '<svg class="cincin" viewBox="0 0 110 110"><circle class="ring" cx="55" cy="55" r="50"/><path d="M39 39 L71 71"/><path d="M71 39 L39 71"/></svg>'
};
var WARNA = {success:'#d4b46a',info:'#9db8d8',warning:'#e3a95f',error:'#e08e8e'};
var sibuk = false, jalan = false, stream = null, fm = 'environment';
var terakhir = '', tTerakhir = 0, timerHasil = null, aksiTutup = null, audio = null;
var cv = document.createElement('canvas');
var ctx = cv.getContext('2d', {willReadFrequently: true});
 
/* ---------- komunikasi ke Apps Script ---------- */
function panggil(params){
  var q = [];
  for (var k in params) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  return fetch(API_URL + '?' + q.join('&'), {redirect: 'follow'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.tipe === 'error' && d.judul === 'Error') throw new Error(d.pesan);
      return d;
    });
}
function apiDaftar(mode, grup){ return panggil({api:'daftar', mode:mode, grup:grup || ''}); }
function apiCheckin(nama){ return panggil({api:'checkin', nama:nama}); }
function apiSimpan(mode, grup, rows){ return panggil({api:'simpan', mode:mode, grup:grup || '', rows:JSON.stringify(rows)}); }
function apiStat(){ return panggil({api:'stat'}); }
 
function $(id){ return document.getElementById(id); }
function tambah(induk, tag, kelas, teks){
  var el = document.createElement(tag);
  if (kelas) el.className = kelas;
  if (teks !== undefined && teks !== '') el.textContent = teks;
  induk.appendChild(el);
  return el;
}
function updateStat(h, t){
  $('statScan').textContent = h + ' dari ' + t + ' tamu hadir';
}
function bunyi(ok){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.value = ok ? 880 : 330; g.gain.value = 0.06;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + (ok ? 0.18 : 0.3));
  } catch (e) {}
}
// Umpan balik instan saat QR terbaca (sebelum menunggu server)
function kunci(){
  var k = $('kamera');
  k.classList.add('kunci');
  setTimeout(function(){ k.classList.remove('kunci'); }, 700);
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
}
 
/* ---------- layar hasil ---------- */
function tampilHasil(h, auto, aksi){
  var l = $('vHasil');
  clearTimeout(timerHasil);
  l.innerHTML = '';
  l.className = 'layar ' + (h.tipe || 'success');
  l.style.setProperty('--aksen', WARNA[h.tipe] || WARNA.success);
  var box = tambah(l, 'div', 'box');
  var wadah = document.createElement('div');
  wadah.innerHTML = IKON[h.tipe] || '';
  if (wadah.firstChild) box.appendChild(wadah.firstChild);
  tambah(box, 'div', 'eyebrow', ACARA);
  tambah(box, 'h1', '', h.judul);
  tambah(box, 'div', 'orn', '✦');
  var nama = h.nama || [];
  for (var i = 0; i < nama.length; i++) tambah(box, 'div', 'nama' + (nama.length > 3 ? ' kecil' : ''), nama[i]);
  if (nama.length > 1) tambah(box, 'p', 'cat', nama.length + ' tamu tercatat hadir');
  if (h.catatan) tambah(box, 'p', 'cat', h.catatan);
  if (h.tipe === 'success') tambah(box, 'div', 'syukur', 'Terima kasih atas kehadiran Anda');
  aksiTutup = aksi || null;
  if (aksi) {
    var b = tambah(box, 'button', 'lagi', aksi.teks);
    b.onclick = function(ev){ ev.stopPropagation(); tutupHasil(); };
  }
  l.onclick = auto ? tutupHasil : null;
  l.hidden = false;
  // sukses ditutup lebih cepat supaya antrean tamu tidak menumpuk
  if (auto) timerHasil = setTimeout(tutupHasil, h.tipe === 'success' ? 2200 : 3500);
  if (h.hadir != null) updateStat(h.hadir, h.total);
  bunyi(h.tipe === 'success');
}
function tutupHasil(){
  clearTimeout(timerHasil);
  $('vHasil').hidden = true;
  var f = aksiTutup; aksiTutup = null;
  if (f && f.fn) f.fn();
  if (listTerbuka()) tutupList(); else { sibuk = false; infoScan('Arahkan QR undangan ke kamera'); }
}
 
/* ---------- daftar (grup / cari nama) ---------- */
function listTerbuka(){ return !$('vList').hidden; }
function terpilih(){ return document.querySelectorAll('#list input:not(:disabled):checked'); }
function pesan(t){ $('pesan').textContent = t || ''; }
function hitung(){
  pesan('');
  $('btn').textContent = 'Simpan Kehadiran (' + terpilih().length + ')';
}
function renderList(d){
  DATA = d;
  $('jdl').textContent = d.judul;
  $('cnt').textContent = d.hadir + ' dari ' + d.anggota.length + ' sudah hadir';
  $('q').hidden = d.mode !== 'cari';
  $('q').value = '';
  $('btnSemua').hidden = d.mode === 'cari';
  var box = $('list'); box.innerHTML = '';
  var frag = document.createDocumentFragment();
  for (var i = 0; i < d.anggota.length; i++) {
    (function(t){
      var lb = document.createElement('label');
      lb.className = 'item' + (t.hadir ? ' done' : '');
      lb.setAttribute('data-n', (t.nama + ' ' + (d.mode === 'cari' ? t.kat : '')).toLowerCase());
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = t.row;
      if (t.hadir) { cb.checked = true; cb.disabled = true; }
      else cb.onchange = function(){ lb.classList.toggle('pilih', cb.checked); hitung(); };
      lb.appendChild(cb);
      var nm = tambah(lb, 'span', 'nm');
      tambah(nm, 'div', 'n1', t.nama);
      if (d.mode === 'cari' && t.kat) tambah(nm, 'div', 'kat', t.kat);
      if (t.hadir) tambah(lb, 'span', 'jam', 'hadir ' + t.jam);
      frag.appendChild(lb);
    })(d.anggota[i]);
  }
  box.appendChild(frag);
  $('kosong').hidden = true;
  hitung();
}
function pilihSemua(){
  var semua = document.querySelectorAll('#list input:not(:disabled)');
  for (var i = 0; i < semua.length; i++) {
    semua[i].checked = true;
    semua[i].parentNode.classList.add('pilih');
  }
  hitung();
}
function cari(){
  var q = $('q').value.toLowerCase().trim();
  var items = document.querySelectorAll('#list .item'), tampil = 0;
  for (var i = 0; i < items.length; i++) {
    var ok = !q || items[i].getAttribute('data-n').indexOf(q) > -1;
    items[i].style.display = ok ? '' : 'none';
    if (ok) tampil++;
  }
  $('kosong').hidden = tampil > 0;
}
function bukaList(d){
  renderList(d);
  $('vScan').hidden = true;
  $('vList').hidden = false;
  window.scrollTo(0, 0);
  if (d.mode === 'cari') setTimeout(function(){ $('q').focus(); }, 150);
}
function tutupList(){
  $('vList').hidden = true;
  $('vScan').hidden = false;
  sibuk = false;
  infoScan('Arahkan QR undangan ke kamera');
  apiStat().then(function(s){ updateStat(s.hadir, s.total); }).catch(function(){});
}
function muatUlang(){
  apiDaftar(DATA.mode, DATA.grup).then(renderList).catch(function(e){ pesan('Gagal memuat: ' + e.message); });
}
function simpan(){
  var cek = terpilih(), rows = [];
  for (var i = 0; i < cek.length; i++) rows.push(Number(cek[i].value));
  if (!rows.length) { pesan('Pilih minimal satu nama.'); return; }
  var btn = $('btn');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';
  apiSimpan(DATA.mode, DATA.grup, rows)
    .then(function(res){
      btn.disabled = false; hitung();
      var h = res.nama.length
        ? {tipe:'success', judul:'Selamat Datang', nama:res.nama, hadir:res.hadir, total:res.total}
        : {tipe:'info', judul:'Tidak Ada Perubahan', catatan:'Semua nama yang dipilih sudah tercatat hadir.'};
      tampilHasil(h, true);
    })
    .catch(function(err){
      btn.disabled = false; hitung();
      pesan('Gagal menyimpan: ' + err.message);
    });
}
 
/* ---------- scanner ---------- */
function infoScan(t, err){
  var el = $('infoScan');
  el.textContent = t;
  el.className = 'infoscan' + (err ? ' err' : '');
}
/* Format QR yang dikenali:
   - Ringkas (disarankan, QR kecil & cepat dibaca):  GB:n:Nama Tamu | GB:g:Nama Grup | GB:c
   - Lama (URL Apps Script):  .../macros/s/.../exec?nama=... | ?grup=... | ?cari=1            */
function urai(t){
  t = String(t).trim();
  var m = /^GB:([ngc])(?::([\s\S]*))?$/i.exec(t);
  if (m) {
    var j = m[1].toLowerCase();
    if (j === 'n' && m[2]) return {jenis:'nama', v:m[2].trim()};
    if (j === 'g' && m[2]) return {jenis:'grup', v:m[2].trim()};
    if (j === 'c') return {jenis:'cari', v:''};
    return null;
  }
  if (t.indexOf('/macros/s/') < 0) return null;
  var i = t.indexOf('?'); if (i < 0) return null;
  var q = t.slice(i + 1).split('#')[0].split('&'), o = {};
  for (var k = 0; k < q.length; k++) {
    var a = q[k].split('=');
    var v = a.slice(1).join('=').split('+').join(' ');
    try { v = decodeURIComponent(v); } catch (e) {}
    o[a[0]] = v;
  }
  if (o.nama) return {jenis:'nama', v:o.nama};
  if (o.grup) return {jenis:'grup', v:o.grup};
  if (o.cari) return {jenis:'cari', v:''};
  return null;
}
function gagalScan(err){
  infoScan('Gagal: ' + (err && err.message ? err.message : err), true);
  sibuk = false; terakhir = '';
}
function dariServer(d){
  if (!d.anggota.length) { tampilHasil({tipe:'error', judul:'Tidak Ditemukan', catatan:'Daftar tidak ditemukan.'}, true); return; }
  bukaList(d);
}
function bukaCari(){
  if (sibuk) return;
  sibuk = true; infoScan('Memuat daftar tamu...');
  apiDaftar('cari', '').then(dariServer).catch(gagalScan);
}
function tangani(teks){
  var skrg = Date.now();
  if (sibuk) return;
  if (teks === terakhir && skrg - tTerakhir < 6000) return;
  terakhir = teks; tTerakhir = skrg;
  var p = urai(teks);
  sibuk = true;
  kunci();
  if (!p) { tampilHasil({tipe:'error', judul:'QR Tidak Valid', catatan:'QR ini bukan QR undangan pernikahan.'}, true); return; }
  infoScan('Memeriksa data tamu...');
  if (p.jenis === 'nama') {
    apiCheckin(p.v).then(function(r){
      var ok = r.tipe === 'success';
      tampilHasil({tipe:r.tipe, judul:r.judul, nama: ok ? [r.nama] : [], catatan: ok ? '' : r.pesan, hadir:r.hadir, total:r.total}, true);
    }).catch(gagalScan);
  } else if (p.jenis === 'grup') {
    apiDaftar('grup', p.v).then(dariServer).catch(gagalScan);
  } else {
    apiDaftar('cari', '').then(dariServer).catch(gagalScan);
  }
}
 
/* ---------- pembaca QR ----------
   1) BarcodeDetector bawaan browser (Chrome Android) - tercepat.
   2) jsQR sebagai cadangan (iPhone/iPad Safari), dengan trik kecepatan:
      - hanya memindai area tengah (persegi), bukan seluruh frame
      - ukuran gambar bergantian (640/900/480/1200 px): ukuran kecil = sangat cepat
        dan meredam moire layar; ukuran besar = QR padat/jauh tetap terbaca
      - mode normal tiap frame, mode QR terbalik hanya tiap 5 frame            */
var detektor = null, mendeteksi = false, nFrame = 0;
var SKALA = [640, 900, 480, 1200];
try { if ('BarcodeDetector' in window) detektor = new BarcodeDetector({formats: ['qr_code']}); } catch (e) { detektor = null; }
 
function bacaJsQR(vid){
  if (typeof jsQR !== 'function') return null;
  var vw = vid.videoWidth, vh = vid.videoHeight;
  var sisi = Math.round(Math.min(vw, vh) * 0.92);
  var sx = Math.round((vw - sisi) / 2), sy = Math.round((vh - sisi) / 2);
  var dst = Math.min(SKALA[nFrame % SKALA.length], sisi);
  cv.width = dst; cv.height = dst;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(vid, sx, sy, sisi, sisi, 0, 0, dst, dst);
  var img = ctx.getImageData(0, 0, dst, dst);
  var mode = (nFrame % 5 === 4) ? 'onlyInvert' : 'dontInvert';
  nFrame++;
  var k = jsQR(img.data, dst, dst, {inversionAttempts: mode});
  return (k && k.data) ? k.data : null;
}
function pindai(){
  var vid = $('vid');
  if (jalan && !sibuk && !mendeteksi && vid.readyState >= 2 && vid.videoWidth) {
    if (detektor) {
      mendeteksi = true;
      var batas = new Promise(function(r){ setTimeout(function(){ r(null); }, 1200); });
      Promise.race([detektor.detect(vid), batas])
        .then(function(h){
          if (h && h.length && h[0].rawValue) return h[0].rawValue;
          return bacaJsQR(vid);
        })
        .catch(function(){ try { return bacaJsQR(vid); } catch (e) { return null; } })
        .then(function(t){
          mendeteksi = false;
          if (t) tangani(t);
          setTimeout(pindai, 30);
        });
      return;
    }
    var t = null;
    try { t = bacaJsQR(vid); } catch (e) {}
    if (t) tangani(t);
  }
  setTimeout(pindai, 30);
}
function stopKamera(){
  jalan = false;
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
}
function mulaiKamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    infoScan('Kamera tidak didukung di browser ini', true); return;
  }
  navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: fm}, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false})
    .then(function(s){
      stream = s;
      var vid = $('vid');
      vid.className = fm === 'user' ? 'cermin' : '';
      vid.srcObject = s;
      try {
        var tr = s.getVideoTracks()[0];
        var cap = tr.getCapabilities ? tr.getCapabilities() : {};
        if (cap.focusMode && cap.focusMode.indexOf('continuous') > -1) tr.applyConstraints({advanced: [{focusMode: 'continuous'}]});
      } catch (e) {}
      return vid.play();
    })
    .then(function(){ jalan = true; infoScan('Arahkan QR undangan ke kamera'); })
    .catch(function(e){ infoScan('Kamera tidak bisa dibuka (' + e.name + '). Izinkan akses kamera.', true); });
}
function gantiKamera(){
  fm = fm === 'environment' ? 'user' : 'environment';
  stopKamera(); mulaiKamera();
}
function kunciLayar(){
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); } catch (e) {}
}
 
/* ---------- mulai ---------- */
$('vScan').hidden = false;
$('btnKembali').hidden = false;
apiStat().then(function(s){ STAT = s; updateStat(s.hadir, s.total); })
  .catch(function(e){ $('statScan').textContent = 'Gagal memuat data'; });
mulaiKamera(); pindai(); kunciLayar();
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) { kunciLayar(); if (!stream && !$('vScan').hidden) mulaiKamera(); }
});
var buf = '';
document.addEventListener('keydown', function(e){
  if (listTerbuka() || !$('vHasil').hidden) return;
  if (e.key === 'Enter') { if (buf.length > 4) tangani(buf); buf = ''; }
  else if (e.key && e.key.length === 1) buf += e.key;
});
